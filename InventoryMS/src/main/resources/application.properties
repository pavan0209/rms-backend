# ===============================
# Application
# ===============================
spring.application.name=InventoryMS
server.port = 8082

# ===============================
# MySQL Configuration
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/inventory_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Swagger UI/ OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
